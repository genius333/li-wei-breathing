<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Дыхание с лепестком | Li Wei</title> 
<script src="lang-switch.js"></script>
<style>
  :root {
    --bg: #1a1f3a;
    --bg-grad: linear-gradient(180deg, #11142b 0%, #1a1f3a 50%, #23284a 100%);
    --petal: #ffb7c5;
    --petal-light: #ffd1dc;
    --accent: #ffd700;
    --accent-text: #8b0000;
    --text: #f0e6f0;
    --text-dim: #a09bb5;
    --font-main: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    background-image: var(--bg-grad);
    color: var(--text);
    font-family: var(--font-main);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* ПРОГРЕСС-БАР */
  #progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.1);
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.5s linear;
  }

  /* ЭКРАНЫ */
  .screen {    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 5;
  }
  .screen.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* SETUP */
  #setup-screen h1 { font-size: clamp(24px, 6vw, 32px); color: var(--accent); margin-bottom: 10px; text-align: center; }
  #setup-screen p { color: var(--text-dim); font-size: clamp(14px, 4vw, 16px); text-align: center; margin-bottom: 25px; max-width: 300px; line-height: 1.4; }
  .selector-group { width: 100%; max-width: 320px; margin-bottom: 20px; }
  .selector-label { color: var(--accent); font-size: 14px; margin-bottom: 8px; display: block; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn-option {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    flex: 1;
    min-width: 80px;
    text-align: center;
  }
  .btn-option.selected { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: bold; }
  
  #custom-settings { display: none; margin-top: 15px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; width: 100%; }
  #custom-settings.show { display: block; }
  .range-wrap { margin-bottom: 10px; }
  .range-wrap label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }

  .start-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 16px 32px;
    border-radius: 50px;    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 4px 15px rgba(255,215,0,0.3);
    transition: transform 0.1s;
  }
  .start-btn:active { transform: scale(0.95); }

  /* GAME */
  #game-screen { justify-content: flex-start; padding-top: 60px; }
  .petal-container {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #main-petal {
    width: clamp(80px, 25vw, 120px);
    height: auto;
    filter: drop-shadow(0 0 20px rgba(255,215,0,0.4));
    transition: transform 1s ease-in-out;
    transform-origin: center bottom;
    z-index: 2;
  }
  .bg-petal {
    position: absolute;
    width: clamp(20px, 8vw, 40px);
    opacity: 0.4;
    filter: blur(1px);
    z-index: 1;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.5; }
    100% { transform: translateY(110vh) rotate(180deg); opacity: 0; }
  }

  #phase-text {
    font-size: clamp(20px, 6vw, 28px);
    color: var(--accent);
    text-align: center;
    margin: 20px 0 10px;
    font-weight: 500;
    letter-spacing: 1px;    min-height: 34px;
  }
  #timer-display {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 14px;
    color: var(--text-dim);
    z-index: 6;
  }

  .controls {
    display: flex;
    gap: 15px;
    padding: 20px 0 40px;
    z-index: 6;
  }
  .ctrl-btn {
    width: 50px; height: 50px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    color: var(--text);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ctrl-btn:active { background: rgba(255,215,0,0.3); transform: scale(0.9); }
  .ctrl-btn.active-sound { background: var(--accent); color: var(--bg); }

  /* END SCREEN - ОБНОВЛЁННЫЙ ПО ТЗ */
  #end-screen {
    text-align: center;
    padding: 30px 20px;
  }
  #end-screen h1 { 
    color: var(--accent); 
    margin-bottom: 12px; 
    font-size: clamp(22px, 6vw, 28px);
  }
  #end-screen p { 
    color: var(--text-dim); 
    margin-bottom: 8px; 
    font-size: clamp(14px, 4vw, 16px);
    line-height: 1.4;
  }
  #end-screen .sakura-text {
    color: #ffb6c1;
    margin-bottom: 25px !important;  }
  
  /* ГЛАВНАЯ КНОПКА ПО ТЗ */
  .cta-main-btn {
    display: block;
    width: 90%;
    max-width: 400px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    padding: 18px 24px;
    border-radius: 35px;
    font-size: clamp(16px, 4.5vw, 18px);
    font-weight: 700;
    cursor: pointer;
    margin: 20px auto 15px;
    box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    animation: pulse 2s infinite;
    text-decoration: none;
  }
  .cta-main-btn:active { 
    transform: scale(0.98); 
    box-shadow: 0 2px 8px rgba(255, 215, 0, 0.3);
  }
  .cta-main-btn:hover {
    transform: scale(1.02);
  }
  
  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4); }
    50% { box-shadow: 0 6px 25px rgba(255, 215, 0, 0.7); }
  }
  
  .share-text {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 10px;
  }

  /* АДАПТИВ */
  @media (max-height: 600px) {
    #setup-screen { padding: 15px; }
    .petal-container { min-height: 40vh; }
    .controls { padding: 10px 0 20px; }
  }
  @media (min-width: 768px) {
    .btn-group { max-width: 400px; margin: 0 auto; }
  }
</style></head>
<body>

<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="timer-display"></div>

<!-- ЭКРАН НАСТРОЙКИ -->
<div id="setup-screen" class="screen active">
  <h1>🌸 Дыхание с лепестком</h1>
  <p>Дышите вместе с движением лепестка. Расслабьтесь.</p>
  
  <div class="selector-group">
    <span class="selector-label">Режим дыхания</span>
    <div class="btn-group" id="mode-group">
      <button class="btn-option selected" data-mode="4-6">4-6 (Базовый)</button>
      <button class="btn-option" data-mode="4-7-8">4-7-8 (Релакс)</button>
      <button class="btn-option" data-mode="custom">Свой темп</button>
    </div>
    <div id="custom-settings">
      <div class="range-wrap">
        <label><span>Вдох</span><span id="inh-val">4с</span></label>
        <input type="range" id="inh-slider" min="2" max="8" value="4">
      </div>
      <div class="range-wrap">
        <label><span>Задержка</span><span id="hold-val">0с</span></label>
        <input type="range" id="hold-slider" min="0" max="10" value="0">
      </div>
      <div class="range-wrap">
        <label><span>Выдох</span><span id="exh-val">6с</span></label>
        <input type="range" id="exh-slider" min="2" max="12" value="6">
      </div>
    </div>
  </div>

  <div class="selector-group">
    <span class="selector-label">Длительность</span>
    <div class="btn-group" id="dur-group">
      <button class="btn-option" data-dur="60">1 мин</button>
      <button class="btn-option selected" data-dur="180">3 мин</button>
      <button class="btn-option" data-dur="300">5 мин</button>
      <button class="btn-option" data-dur="0">∞</button>
    </div>
  </div>

  <div class="btn-group" style="margin-bottom: 15px;">
    <button class="btn-option" id="sound-toggle-setup">🔊 Звук: ВКЛ</button>
  </div>
  <button class="start-btn" id="start-btn">НАЧАТЬ ПРАКТИКУ</button>
</div>
<!-- ЭКРАН ПРАКТИКИ -->
<div id="game-screen" class="screen">
  <div class="petal-container" id="petal-area">
    <svg id="main-petal" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 10 C20 30, 5 60, 20 90 C30 105, 45 115, 50 115 C55 115, 70 105, 80 90 C95 60, 80 30, 50 10Z" fill="url(#petalGrad)" stroke="#fff" stroke-width="1" stroke-opacity="0.3"/>
      <path d="M50 115 L50 20" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
      <defs>
        <linearGradient id="petalGrad" x1="20" y1="10" x2="80" y2="115" gradientUnits="userSpaceOnUse">
          <stop stop-color="#ffd1dc"/>
          <stop offset="1" stop-color="#ffb7c5"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
  <div id="phase-text">Приготовьтесь...</div>
  <div class="controls">
    <button class="ctrl-btn" id="pause-btn">⏸️</button>
    <button class="ctrl-btn active-sound" id="sound-btn">🔊</button>
    <button class="ctrl-btn" id="reset-btn">🔄</button>
    <button class="ctrl-btn" id="close-btn">❌</button>
  </div>
</div>

<!-- ЭКРАН ЗАВЕРШЕНИЯ (ОБНОВЛЁННЫЙ) -->
<div id="end-screen" class="screen">
  <h1>✅ Практика завершена</h1>
  <p>Почувствуйте спокойствие и лёгкость.</p>
  <p class="sakura-text">Вы сделали шаг к гармонии 🌸</p>
  
  <!-- ЕДИНАЯ ГЛАВНАЯ КНОПКА ПО ТЗ -->
  <a href="https://genius333.github.io/li-wei-site/#practices" class="cta-main-btn">
    🚀 Продолжить путь к здоровью →
  </a>
  
  <p class="share-text">Понравилось? Поделись с друзьями 🌸</p>
</div>

<script>
  // --- СОСТОЯНИЕ ---
  const state = {
    mode: '4-6',
    durations: { inhale: 4000, hold: 0, exhale: 6000 },
    totalTime: 180000,
    timeLeft: 180000,
    isPlaying: false,
    isPaused: false,
    soundOn: true,
    currentPhase: 'idle',
    timerInterval: null,
    phaseTimeout: null,    audioCtx: null,
    gainNode: null,
    birdsAudio: null,
    ambientAudio: null
  };

  // --- DOM ---
  const $ = id => document.getElementById(id);
  const screens = { setup: $('setup-screen'), game: $('game-screen'), end: $('end-screen') };
  const petal = $('main-petal');
  const phaseText = $('phase-text');
  const progressFill = $('progress-fill');
  const timerDisplay = $('timer-display');
  const petalArea = $('petal-area');

  // --- ФОНОВЫЕ ЛЕПЕСТКИ ---
  for(let i=0; i<5; i++) {
    const p = document.createElement('div');
    p.className = 'bg-petal';
    p.innerHTML = `<svg viewBox="0 0 50 60" fill="url(#petalGrad)"><path d="M25 5 C10 15, 2 30, 10 45 C15 52, 22 57, 25 57 C28 57, 35 52, 40 45 C48 30, 40 15, 25 5Z"/></svg>`;
    p.style.left = Math.random()*90 + 5 + '%';
    p.style.animationDuration = (8 + Math.random()*10) + 's';
    p.style.animationDelay = (Math.random()*10) + 's';
    p.style.width = (20 + Math.random()*20) + 'px';
    petalArea.appendChild(p);
  }

  // --- АУДИО ---
  function initAudio() {
    if(state.audioCtx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    state.audioCtx = new AudioContext();
    state.gainNode = state.audioCtx.createGain();
    state.gainNode.gain.value = state.soundOn ? 0.3 : 0;
    state.gainNode.connect(state.audioCtx.destination);

    state.birdsAudio = new Audio('birds.mp3');
    state.birdsAudio.loop = true;
    state.birdsAudio.volume = state.soundOn ? 0.3 : 0;
    state.birdsAudio.crossOrigin = "anonymous";

    state.ambientAudio = new Audio('ambient.mp3');
    state.ambientAudio.loop = true;
    state.ambientAudio.volume = state.soundOn ? 0.25 : 0;
    state.ambientAudio.crossOrigin = "anonymous";
  }

  function toggleSound() {
    state.soundOn = !state.soundOn;
    if(state.birdsAudio) state.birdsAudio.volume = state.soundOn ? 0.3 : 0;    if(state.ambientAudio) state.ambientAudio.volume = state.soundOn ? 0.25 : 0;
    if(!state.soundOn) {
      if(state.birdsAudio) state.birdsAudio.pause();
      if(state.ambientAudio) state.ambientAudio.pause();
    } else if(state.isPlaying) {
      if(state.birdsAudio) state.birdsAudio.play();
      if(state.ambientAudio) state.ambientAudio.play();
    }
    $('sound-btn').classList.toggle('active-sound', state.soundOn);
    $('sound-btn').textContent = state.soundOn ? '🔊' : '🔇';
    $('sound-toggle-setup').textContent = state.soundOn ? '🔊 Звук: ВКЛ' : '🔇 Звук: ВЫКЛ';
    $('sound-toggle-setup').classList.toggle('selected', state.soundOn);
  }

  // --- ЛОГИКА ДЫХАНИЯ ---
  function updateDurations() {
    if(state.mode === '4-6') state.durations = { inhale: 4000, hold: 0, exhale: 6000 };
    else if(state.mode === '4-7-8') state.durations = { inhale: 4000, hold: 7000, exhale: 8000 };
    else {
      state.durations = {
        inhale: parseInt($('inh-slider').value) * 1000,
        hold: parseInt($('hold-slider').value) * 1000,
        exhale: parseInt($('exh-slider').value) * 1000
      };
    }
  }

  function runPhase(phase) {
    if(!state.isPlaying || state.isPaused) return;
    state.currentPhase = phase;
    const dur = state.durations[phase];
    const isUp = phase === 'inhale';
    const isHold = phase === 'hold';

    if (isUp) phaseText.textContent = '👃 Вдох носом...';
    else if (isHold) phaseText.textContent = '⏸️ Задержка...';
    else phaseText.textContent = '👄 Выдох ртом...';
    
    if(navigator.vibrate && !isHold) navigator.vibrate(30);

    petal.style.transition = `transform ${dur}ms ease-in-out`;
    if(isUp) petal.style.transform = 'translateY(-35vh) rotate(4deg) scale(1.05)';
    else if(isHold) petal.style.transform = 'translateY(-35vh) rotate(-2deg) scale(1.02)';
    else petal.style.transform = 'translateY(0) rotate(0deg) scale(1)';

    state.phaseTimeout = setTimeout(() => {
      if(phase === 'inhale') runPhase(state.durations.hold > 0 ? 'hold' : 'exhale');
      else if(phase === 'hold') runPhase('exhale');
      else runPhase('inhale');
    }, dur);  }

  function startBreathing() {
    state.isPlaying = true;
    state.isPaused = false;
    showScreen('game');
    phaseText.textContent = 'Приготовьтесь...';
    if(state.soundOn) {
      if(state.birdsAudio) state.birdsAudio.play().catch(e => console.log('Birds error:', e));
      if(state.ambientAudio) state.ambientAudio.play().catch(e => console.log('Ambient error:', e));
    }
    setTimeout(() => runPhase('inhale'), 1000);
  }

  function pauseBreathing() {
    state.isPaused = !state.isPaused;
    $('pause-btn').textContent = state.isPaused ? '▶️' : '⏸️';
    if(state.birdsAudio) state.isPaused ? state.birdsAudio.pause() : state.birdsAudio.play();
    if(state.ambientAudio) state.isPaused ? state.ambientAudio.pause() : state.ambientAudio.play();
    if(state.isPaused) {
      clearTimeout(state.phaseTimeout);
      petal.style.transition = 'none';
    } else {
      runPhase(state.currentPhase === 'hold' ? 'exhale' : state.currentPhase);
    }
  }

  // --- ТАЙМЕР ---
  function startTimer() {
    if(state.totalTime === 0) { timerDisplay.textContent = '∞'; return; }
    state.timeLeft = state.totalTime;
    updateTimerDisplay();
    state.timerInterval = setInterval(() => {
      if(state.isPaused) return;
      state.timeLeft -= 1000;
      if(state.timeLeft <= 0) { state.timeLeft = 0; endPractice(); }
      updateTimerDisplay();
      progressFill.style.width = ((state.totalTime - state.timeLeft) / state.totalTime * 100) + '%';
    }, 1000);
  }

  function updateTimerDisplay() {
    if(state.totalTime === 0) return;
    const m = Math.floor(state.timeLeft / 60000);
    const s = Math.floor((state.timeLeft % 60000) / 1000);
    timerDisplay.textContent = `Осталось: ${m}:${s.toString().padStart(2,'0')}`;
  }

  function endPractice() {
    state.isPlaying = false;    clearInterval(state.timerInterval);
    clearTimeout(state.phaseTimeout);
    if(state.birdsAudio) { state.birdsAudio.pause(); state.birdsAudio.currentTime = 0; }
    if(state.ambientAudio) { state.ambientAudio.pause(); state.ambientAudio.currentTime = 0; }
    petal.style.transition = 'transform 2s ease';
    petal.style.transform = 'translateY(0) scale(0.8)';
    setTimeout(() => showScreen('end'), 500);
  }

  function resetGame() {
    clearInterval(state.timerInterval);
    clearTimeout(state.phaseTimeout);
    state.isPlaying = false;
    state.isPaused = false;
    progressFill.style.width = '0%';
    timerDisplay.textContent = '';
    petal.style.transition = 'none';
    petal.style.transform = 'translateY(0) rotate(0) scale(1)';
    if(state.birdsAudio) { state.birdsAudio.pause(); state.birdsAudio.currentTime = 0; }
    if(state.ambientAudio) { state.ambientAudio.pause(); state.ambientAudio.currentTime = 0; }
    showScreen('setup');
  }

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  // --- ОБРАБОТЧИКИ ---
  document.querySelectorAll('#mode-group .btn-option').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#mode-group .btn-option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      state.mode = btn.dataset.mode;
      $('custom-settings').classList.toggle('show', state.mode === 'custom');
      updateDurations();
    });
  });

  ['inh', 'hold', 'exh'].forEach(k => {
    const slider = $(`${k}-slider`);
    const label = $(`${k}-val`);
    slider.addEventListener('input', () => {
      label.textContent = slider.value + 'с';
      if(state.mode === 'custom') updateDurations();
    });
  });

  document.querySelectorAll('#dur-group .btn-option').forEach(btn => {
    btn.addEventListener('click', () => {      document.querySelectorAll('#dur-group .btn-option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      state.totalTime = parseInt(btn.dataset.dur) * 1000;
    });
  });

  $('sound-toggle-setup').addEventListener('click', () => { initAudio(); toggleSound(); });
  $('start-btn').addEventListener('click', () => { initAudio(); updateDurations(); startBreathing(); startTimer(); });
  $('pause-btn').addEventListener('click', pauseBreathing);
  $('sound-btn').addEventListener('click', () => { initAudio(); toggleSound(); });
  $('reset-btn').addEventListener('click', resetGame);
  $('close-btn').addEventListener('click', () => { resetGame(); window.location.href = 'https://genius333.github.io/li-wei-site/'; });
  // ❌ УДАЛЕНО: обработчик restart-btn (кнопка больше не нужна)

  // Сохранение настроек
  try {
    const saved = JSON.parse(localStorage.getItem('breath_settings'));
    if(saved) {
      state.mode = saved.mode || '4-6';
      state.totalTime = saved.totalTime || 180000;
      state.soundOn = saved.soundOn !== false;
      document.querySelector(`[data-mode="${state.mode}"]`)?.click();
      document.querySelector(`[data-dur="${state.totalTime/1000}"]`)?.click();
      toggleSound();
    }
  } catch(e){}
  window.addEventListener('beforeunload', () => {
    localStorage.setItem('breath_settings', JSON.stringify({
      mode: state.mode, totalTime: state.totalTime, soundOn: state.soundOn
    }));
  });
</script>
</body>
</html>
